name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Current Go toolchain checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read current Go version
        id: current-go
        run: |
          version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2; exit }' go.mod)
          if [[ -z "$version" ]]; then
            version=$(awk '$1 == "go" { print $2; exit }' go.mod)
          fi
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up current Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.current-go.outputs.version }}
          cache: true

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Verify current Go version
        env:
          EXPECTED_GO_VERSION: ${{ steps.current-go.outputs.version }}
        run: test "$(go env GOVERSION)" = "go$EXPECTED_GO_VERSION"

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Run checks
        run: mise run check

      - name: Verify clean working tree
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi
