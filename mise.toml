[tools]
"npm:skills" = "latest"

[tasks.update]
description = "Update direct dependencies"
run = [
  "skills add JetBrains/go-modern-guidelines --skill use-modern-go --agent universal --yes",
  "go get $(go list -m -f {% raw %}'{{if and (not .Main) (not .Indirect)}}{{.Path}}@latest{{end}}'{% endraw %} all)",
  "go mod tidy",
  "mise run check",
]

[tasks.fmt]
description = "Format Go files"
run = [
  "find . -name '*.go' -not -path './tsnet-state/*' -print0 | xargs -0 go tool goimports -w",
  "find . -name '*.go' -not -path './tsnet-state/*' -print0 | xargs -0 go tool gofumpt -w",
]

[tasks.lint]
description = "Run Go linters"
run = [
  "test -z \"$(find . -name '*.go' -not -path './tsnet-state/*' -print0 | xargs -0 go tool goimports -l)\"",
  "test -z \"$(find . -name '*.go' -not -path './tsnet-state/*' -print0 | xargs -0 go tool gofumpt -l)\"",
  "go vet ./...",
  "go tool govulncheck ./...",
  "go tool staticcheck ./...",
  "go tool errcheck ./...",
]

[tasks.test]
description = "Run tests with race detector"
run = "go test -race ./..."

[tasks.build]
description = "Build binary"
run = "go build -o tsnet-http-relay ."

[tasks.build-linux-amd64]
description = "Cross-compile Linux amd64 binary"
run = "GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/tsnet-http-relay-linux-amd64 ."

[tasks.clean]
description = "Remove build outputs"
run = "rm -f tsnet-http-relay"

[tasks.check]
description = "Lint and test"
run = [
  "mise run lint",
  "mise run test",
]
